<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Quiz Master</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styleq.css">
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="hud-container slide-in">
    <h2>Login</h2>
    <form action="php/login.php" method="POST">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <p style="text-align:center; margin-top:10px;">
        Don't have an account? <a href="signup.html" style="color:#ff80ab;">Sign Up</a>
    </p>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.querySelector('.hud-container');
    form.classList.add('slide-in-active');
});
</script>

</body>
</html>
